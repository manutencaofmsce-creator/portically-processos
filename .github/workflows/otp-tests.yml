name: OTP PostgreSQL V1
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  otp:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: otp_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: otp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U otp_test -d otp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://otp_test:test-only-password@localhost:5432/otp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q
